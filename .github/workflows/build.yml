name: Build

on:
  push:
    branches: [linux]
  pull_request:
    branches: [linux]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            relay-server/package-lock.json
            extension/package-lock.json

      - name: Install relay-server dependencies
        run: npm ci
        working-directory: relay-server

      - name: Install extension dependencies
        run: npm ci
        working-directory: extension

      # "npm test" compiles first, so TypeScript errors fail here too.
      - name: Test relay-server
        run: npm test
        working-directory: relay-server

      - name: Test extension
        run: npm test
        working-directory: extension

      # Runs tsc, syncs relay-server + mobile-ui into the bundle and builds the VSIX.
      - name: Package extension (VSIX)
        run: npm run package
        working-directory: extension

      - name: Upload VSIX
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: kiro-remote-control-vsix
          path: extension/*.vsix
          if-no-files-found: error

  validate-mobile-ui:
    name: Validate Mobile UI JavaScript
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Syntax-check index.html script block
        run: |
          node -e "
          const fs = require('fs');
          const h = fs.readFileSync('mobile-ui/index.html', 'utf8');
          const m = h.match(/<script>([\s\S]*?)<\/script>/);
          if (!m) { console.error('No <script> block found'); process.exit(1); }
          require('vm').compileFunction(m[1]);
          console.log('index.html JS OK');
          "

      - name: Syntax-check sw.js
        run: node -e "require('vm').compileFunction(require('fs').readFileSync('mobile-ui/sw.js','utf8')); console.log('sw.js OK');"
